name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # -Xlint:all com failOnWarning: qualquer aviso do javac quebra o build.
      - run: mvn -B test-compile -Dlint=true

  test:
    runs-on: ubuntu-latest
    # O mesmo Postgres e a mesma porta do docker-compose.yml: os testes não sabem onde rodam.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tino
          POSTGRES_USER: tino
          POSTGRES_PASSWORD: tino
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U tino -d tino"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B verify

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # O runner é x86_64 e a VM é ARM, então o build é emulado.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
