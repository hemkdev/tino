services:
  db:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_DB: tino
      POSTGRES_USER: tino
      POSTGRES_PASSWORD: tino
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tino -d tino"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
